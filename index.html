<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Thaalam 24x7</title>

  <link rel="stylesheet" href="style.css?v=5">
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#05070d">
</head>

<body>

  <div class="app">

    <div class="logo-card">
      <img id="logoImg" alt="Thaalam 24x7">
    </div>

    <div class="station" id="stationName">
      Thaalam 24x7
    </div>

    <div class="tagline">
      <span id="nowPlaying">The Best Music</span>
    </div>

    <div class="live-row">
      <div class="live-line"></div>

      <div class="live-text">
        LIVE
      </div>

      <div class="live-line"></div>
    </div>

    <audio id="radio"></audio>

    <div class="play-btn" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>

  </div>

  <script src="script.js?v=5"></script>

</body>
</html>
