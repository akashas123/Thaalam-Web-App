<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Thaalam 24x7</title>

  <link rel="stylesheet" href="style.css?v=18">
  <style>
    .tagline[class~="marquee"] span {
      animation-duration: 45s;
      animation-delay: 0s;
      animation-iteration-count: infinite;
    }
    .tagline[class~="marquee"] > span {
      display: flex;
      width: max-content;
      gap: 3rem;
      animation: marqueeLoop 45s linear infinite;
    }
    body.paused-gradient .tagline[class~="marquee"] > span {
      animation-play-state: paused;
    }
    .tagline[class~="marquee"] > span > span {
      flex: 0 0 auto;
      animation: none;
    }
    @keyframes marqueeLoop {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-50% - 1.5rem)); }
    }
  </style>
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#05070d">
</head>

<body>

  <div class="app">

    <div class="logo-card">
      <img id="logoImg" alt="Thaalam 24x7">
    </div>

    <div class="station" id="stationName">
      Thaalam 24x7
    </div>

    <div class="tagline">
      <span id="nowPlaying">Non-Stop 24x7</span>
    </div>

    <div class="live-row">
      <div class="live-line"></div>

      <div class="live-text">
        LIVE
      </div>

      <div class="live-line"></div>
    </div>

    <audio id="radio"></audio>

    <div class="player-controls">
      <button class="side-control" id="songInfoButton" type="button" aria-label="Song information" title="Song information">
        <span aria-hidden="true">i</span>
      </button>

      <button class="play-btn" id="playButton" type="button" onclick="togglePlay()" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <button class="side-control" id="sleepTimerButton" type="button" aria-label="Sleep timer" title="Sleep timer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z"/>
        </svg>
      </button>
    </div>

  </div>

  <dialog class="control-dialog song-info-dialog" id="songInfoDialog" aria-labelledby="songInfoTitle">
    <form method="dialog"><button class="dialog-close" aria-label="Close">&times;</button></form>
    <h2 id="songInfoTitle">Now playing</h2>
    <img class="song-info-art" id="songInfoArt" alt="Current album artwork">
    <p class="song-info-track" id="songInfoTrack">Thaalam 24x7</p>
    <p class="song-info-artist" id="songInfoArtist"></p>
    <p class="song-info-details" id="songInfoDetails">Loading track details...</p>
    <p class="song-info-background" id="songInfoBackground" hidden></p>
    <a class="song-info-wiki-link" id="songInfoWikiLink" target="_blank" rel="noopener noreferrer" hidden></a>
  </dialog>

  <dialog class="control-dialog sleep-dialog" id="sleepTimerDialog" aria-labelledby="sleepTimerTitle">
    <form method="dialog"><button class="dialog-close" aria-label="Close">&times;</button></form>
    <h2 id="sleepTimerTitle">Sleep timer</h2>
    <div class="timer-options">
      <button type="button" data-minutes="15">15 minutes</button>
      <button type="button" data-minutes="30">30 minutes</button>
      <button type="button" data-minutes="45">45 minutes</button>
      <button type="button" data-minutes="60">60 minutes</button>
      <button type="button" id="cancelSleepTimer" hidden>Cancel timer</button>
    </div>
    <p class="timer-status" id="sleepTimerStatus" aria-live="polite"></p>
  </dialog>

  <aside class="lyrics-panel" id="lyricsPanel" aria-live="polite" aria-hidden="true">
    <button class="lyrics-toggle" id="lyricsToggle" type="button" aria-expanded="false">
      <span class="lyrics-heading">Lyrics (Beta)</span>
      <span class="lyrics-toggle-icon" aria-hidden="true">⌃</span>
    </button>
    <div class="lyrics-notice" id="lyricsNotice" hidden>Lyrics aren't time-synced.</div>
    <div class="lyrics-song" id="lyricsSong"></div>
    <div class="lyrics-content" id="lyricsContent"></div>
  </aside>

  <script src="script.js?v=5"></script>
  <script src="marquee.js?v=2"></script>
  <script src="media-metadata.js?v=1"></script>
  <script src="player-controls.js?v=17"></script>
  <script src="lyrics.js?v=17"></script>

</body>
</html>
